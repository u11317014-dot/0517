<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙語著色大師 - 水果樂園</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        @keyframes confettiFall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(400px) rotate(360deg); opacity: 0; }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-confetti { animation: confettiFall 3s linear infinite; position: absolute; }
        canvas { touch-action: none; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-[#FFFBEB]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 純資料設定 (修正：幾何完美置中，葡萄採用標準閉合多圓路徑) ---
        const LEVELS = [
            { 
                id: 1, 
                targetColor: '#FF3D00', 
                colorName: { zh: '紅色', en: 'Red' }, 
                objectName: { zh: '蘋果', en: 'Apple' }, 
                path: "M 100,65 C 75,60 40,65 40,115 C 40,155 75,175 100,165 C 125,175 160,155 160,115 C 160,65 125,60 100,65 Z"
            },
            { 
                id: 2, 
                targetColor: '#4CAF50', 
                colorName: { zh: '綠色', en: 'Green' }, 
                objectName: { zh: '樹葉', en: 'Leaf' }, 
                path: "M 100,35 C 50,75 45,145 100,185 C 155,145 150,75 100,35 Z"
            },
            { 
                id: 3, 
                targetColor: '#FFD600', 
                colorName: { zh: '黃色', en: 'Yellow' }, 
                objectName: { zh: '香蕉', en: 'Banana' }, 
                path: "M 155,55 C 120,55 55,90 45,165 C 68,165 125,120 155,55 Z"
            },
            { 
                id: 4, 
                targetColor: '#FF9800', 
                colorName: { zh: '橘色', en: 'Orange' }, 
                objectName: { zh: '橘子', en: 'Orange' }, 
                path: "M 100,55 C 145,55 175,83 175,125 C 175,167 145,195 100,195 C 55,195 25,167 25,125 C 25,83 55,55 100,55 Z"
            },
            { 
                id: 5, 
                targetColor: '#9C27B0', 
                colorName: { zh: '紫色', en: 'Purple' }, 
                objectName: { zh: '葡萄', en: 'Grapes' }, 
                // 核心大修正：使用 6 個完全閉合的圓形路徑拼接，Canvas 剪裁（Clip）100% 支援，可完美著色！
                path: "M 80,90 A 15,15 0 1,1 80,89.9 Z M 100,90 A 15,15 0 1,1 100,89.9 Z M 120,90 A 15,15 0 1,1 120,89.9 Z M 90,115 A 15,15 0 1,1 90,114.9 Z M 110,115 A 15,15 0 1,1 110,114.9 Z M 100,140 A 15,15 0 1,1 100,139.9 Z"
            }
        ];

        const COLORS = [
            { zh: '紅色', en: 'Red', code: '#FF3D00' },
            { zh: '黃色', en: 'Yellow', code: '#FFD600' },
            { zh: '綠色', en: 'Green', code: '#4CAF50' },
            { zh: '藍色', en: 'Blue', code: '#2196F3' },
            { zh: '橘色', en: 'Orange', code: '#FF9800' },
            { zh: '紫色', en: 'Purple', code: '#9C27B0' }
        ];

        // --- 純 React SVG 圖標元件 ---
        const PaletteIcon = () => (
            <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 14.7255 3.09032 17.1962 4.85857 19C5.03456 19.176 5.09705 19.435 5.01633 19.6773C4.85691 20.1557 4.77 20.6678 4.77 21.2C4.77 21.6418 5.12817 22 5.57 22H12Z" />
                <circle cx="7.5" cy="10.5" r="1.5" fill="currentColor" />
                <circle cx="11.5" cy="7.5" r="1.5" fill="currentColor" />
                <circle cx="16.5" cy="9.5" r="1.5" fill="currentColor" />
                <circle cx="15.5" cy="14.5" r="1.5" fill="currentColor" />
            </svg>
        );

        const LanguagesIcon = () => (
            <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m5 8 6 6" /><path d="m4 14 6-6 2-3" /><path d="M2 5h12" /><path d="M7 2h1" /><path d="m22 22-5-10-5 10" /><path d="M14 18h6" /><path d="M12 5c.6 2 2 4 4 5.5" /><path d="M20 5c-.3 1.2-1.2 2.7-3 4" />
            </svg>
        );

        const VolumeIcon = () => (
            <svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
        );

        const RotateCcwIcon = () => (
            <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><polyline points="3 3 3 8 8 8" />
            </svg>
        );

        const StarIcon = ({ fill = "none" }) => (
            <svg className="w-7 h-7 text-yellow-400" viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
            </svg>
        );

        const ChevronRightIcon = () => (
            <svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="9 18 15 12 9 6" />
            </svg>
        );

        const Confetti = () => {
            return Array.from({ length: 30 }).map((_, i) => (
                <div 
                    key={i}
                    className="animate-confetti w-3 h-3 rounded-sm"
                    style={{
                        backgroundColor: ['#FF3D00', '#FFD600', '#4CAF50', '#2196F3', '#FF9800', '#9C27B0'][i % 6],
                        left: `${Math.random() * 100}%`,
                        top: `-20px`,
                        animationDelay: `${Math.random() * 2.5}s`,
                        transform: `rotate(${Math.random() * 360}deg)`
                    }}
                />
            ));
        };

        const App = () => {
            const [levelIdx, setLevelIdx] = useState(0);
            const [lang, setLang] = useState('zh');
            const [selectedColor, setSelectedColor] = useState(null);
            const [coverage, setCoverage] = useState(0);
            const [isCompleted, setIsCompleted] = useState(false);
            const [isDrawing, setIsDrawing] = useState(false);
            
            const canvasRef = useRef(null);
            const maskCanvasRef = useRef(null);
            const ctxRef = useRef(null);
            const lastPos = useRef({ x: 0, y: 0 });
            const currentLevel = LEVELS[levelIdx];

            // 系統雙語語音功能
            const speak = (text, language) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = language === 'zh' ? 'zh-TW' : 'en-US';
                    utterance.rate = 0.95;
                    window.speechSynthesis.speak(utterance);
                }
            };

            const speakQuestion = () => {
                const zhText = `${currentLevel.objectName.zh}是什麼顏色的呢？`;
                const enText = `What color is the ${currentLevel.objectName.en}?`;
                speak(zhText, 'zh');
                setTimeout(() => speak(enText, 'en'), 1600);
            };

            // 關卡切換初始化
            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctxRef.current = ctx;
                ctx.clearRect(0, 0, 200, 200);
                
                const mCanvas = maskCanvasRef.current;
                const mCtx = mCanvas.getContext('2d');
                mCtx.clearRect(0, 0, 200, 200);
                
                // 隱藏畫布計算填滿路徑
                const pathObj = new Path2D(currentLevel.path);
                mCtx.fillStyle = '#000000';
                mCtx.fill(pathObj);

                setCoverage(0);
                setIsCompleted(false);
                setSelectedColor(null); // 切換關卡時重設顏色，讓小朋友重新思考點選
                speakQuestion();
            }, [levelIdx]);

            // 最上層裝飾墨線
            const renderLevelDetails = (id) => {
                switch(id) {
                    case 1: 
                        return (
                            <g fill="none" stroke="#2D3436" strokeWidth="2">
                                <path d="M100,65 Q102,45 110,40" stroke="#795548" strokeWidth="4" strokeLinecap="round" />
                                <path d="M104,48 Q125,35 130,50 Q115,55 104,48" fill="#4CAF50" stroke="#2D3436" strokeWidth="2" />
                            </g>
                        );
                    case 2: 
                        return (
                            <g fill="none" stroke="#2D3436" strokeWidth="2" opacity="0.4">
                                <path d="M100,35 L100,185" />
                                <path d="M100,70 L135,95 M100,100 L142,125 M100,130 L135,155" />
                                <path d="M100,70 L65,95 M100,100 L58,125 M100,130 L65,155" />
                            </g>
                        );
                    case 3: 
                        return (
                            <g fill="none" stroke="#2D3436" strokeWidth="2">
                                <path d="M155,55 L163,47" stroke="#795548" strokeWidth="6" strokeLinecap="round" />
                                <path d="M45,165 L40,168" stroke="#5D4037" strokeWidth="6" strokeLinecap="round" />
                                <path d="M155,55 Q105,80 45,165" stroke="#2D3436" strokeWidth="1.5" strokeLinecap="round" opacity="0.25" />
                            </g>
                        );
                    case 4: 
                        return (
                            <g fill="none" stroke="#2D3436" strokeWidth="2">
                                <circle cx="100" cy="55" r="2" fill="#2D3436" />
                                <path d="M100,55 Q115,35 130,45 Q115,50 100,55" fill="#4CAF50" stroke="#2D3436" strokeWidth="2" />
                                <circle cx="65" cy="100" r="1.5" fill="#2D3436" opacity="0.2" />
                                <circle cx="75" cy="140" r="1.5" fill="#2D3436" opacity="0.2" />
                                <circle cx="135" cy="110" r="1.5" fill="#2D3436" opacity="0.2" />
                                <circle cx="125" cy="150" r="1.5" fill="#2D3436" opacity="0.2" />
                            </g>
                        );
                    case 5: // 葡萄高光與葉片，完美貼合純圓點
                        return (
                            <g fill="none" stroke="#2D3436" strokeWidth="2">
                                <path d="M100,75 C100,60 110,45 115,45" stroke="#795548" strokeWidth="3" strokeLinecap="round" />
                                <path d="M100,65 Q90,60 90,50 T100,45" stroke="#4CAF50" strokeWidth="1.5" strokeLinecap="round" />
                                <path d="M73,85 A5,5 0 0 1 78,80" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.8" />
                                <path d="M93,85 A5,5 0 0 1 98,80" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.8" />
                                <path d="M113,85 A5,5 0 0 1 118,80" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.8" />
                                <path d="M83,110 A5,5 0 0 1 88,105" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.8" />
                                <path d="M103,110 A5,5 0 0 1 108,105" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.8" />
                                <path d="M93,135 A5,5 0 0 1 98,130" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" opacity="0.8" />
                            </g>
                        );
                    default:
                        return null;
                }
            };

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: (clientX - rect.left) * (200 / rect.width),
                    y: (clientY - rect.top) * (200 / rect.height)
                };
            };

            // 核心修正：強制重新 start 與 clip 剪裁路徑，徹底鎖死在黑框內
            const drawSegment = (x1, y1, x2, y2) => {
                const ctx = ctxRef.current;
                ctx.save();
                
                ctx.beginPath(); // 強制刷清舊路徑
                ctx.clip(new Path2D(currentLevel.path)); // 精確封閉路徑限制
                
                ctx.globalAlpha = 0.55;
                ctx.lineWidth = 26; 
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = selectedColor.code;
                
                ctx.beginPath(); // 繪製線條專用起筆
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                
                ctx.restore();
            };

            const handleStart = (e) => {
                if (isCompleted || !selectedColor) return;
                if (selectedColor.code !== currentLevel.targetColor) {
                    speakBilingual(`這不是${currentLevel.objectName.zh}的顏色喔`, `That's not the color of ${currentLevel.objectName.en}`);
                    return;
                }
                setIsDrawing(true);
                const pos = getPos(e);
                lastPos.current = pos;
                drawSegment(pos.x, pos.y, pos.x, pos.y);
            };

            const handleMove = (e) => {
                if (!isDrawing) return;
                const pos = getPos(e);
                drawSegment(lastPos.current.x, lastPos.current.y, pos.x, pos.y);
                lastPos.current = pos;
            };

            const handleEnd = () => {
                if (!isDrawing) return;
                setIsDrawing(false);
                
                const drawData = ctxRef.current.getImageData(0,0,200,200).data;
                const maskData = maskCanvasRef.current.getContext('2d').getImageData(0,0,200,200).data;
                let totalPixels = 0, coloredPixels = 0;
                
                for (let i = 0; i < maskData.length; i += 4) {
                    if (maskData[i+3] > 0) { 
                        totalPixels++;
                        if (drawData[i+3] > 50) { 
                            coloredPixels++;
                        }
                    }
                }
                
                const percent = totalPixels > 0 ? (coloredPixels / totalPixels) * 100 : 0;
                setCoverage(percent);
                
                if (percent >= 80 && !isCompleted) {
                    setIsCompleted(true);
                    speakBilingual("哇！太棒了！你答對又塗好了！", "Wonderful! You got it right and colored it!");
                }
            };

            return (
                <div className="min-h-screen flex flex-col items-center p-4 font-sans select-none touch-none">
                    <canvas ref={maskCanvasRef} width="200" height="200" className="hidden" />
                    
                    {/* 標題欄 */}
                    <header className="w-full max-w-md flex justify-between items-center mb-5">
                        <div className="flex items-center gap-2.5">
                            <div className="bg-orange-500 p-2 rounded-xl text-white shadow-lg">
                                <PaletteIcon />
                            </div>
                            <div>
                                <h1 className="font-black text-gray-800 text-lg">{lang === 'zh' ? '雙語著色大師' : 'Bilingual Coloring'}</h1>
                                <p className="text-[10px] text-orange-500 font-bold uppercase tracking-widest">Fruits Garden</p>
                            </div>
                        </div>
                        <button 
                            onClick={() => {
                                const nextLang = lang === 'zh' ? 'en' : 'zh';
                                setLang(nextLang);
                                speak(nextLang === 'zh' ? '中文' : 'English', nextLang);
                            }} 
                            className="bg-white px-4 py-1.5 rounded-full text-sm font-bold shadow-md border-2 border-orange-100 hover:bg-orange-50 active:scale-95 transition-all flex items-center gap-1 text-gray-700"
                        >
                            <LanguagesIcon />
                            {lang === 'zh' ? 'English' : '中文'}
                        </button>
                    </header>

                    {/* 修正需求：變更為水果提問引導句 */}
                    <div className="text-center mb-5">
                        <div className="inline-flex items-center bg-white px-5 py-2 rounded-2xl shadow-sm mb-3 border border-orange-100 gap-2">
                            <h2 className="text-xl md:text-2xl font-black text-gray-800">
                                {lang === 'zh' ? `${currentLevel.objectName.zh}是什麼顏色的呢？` : `What color is the ${currentLevel.objectName.en}?`}
                            </h2>
                            <button 
                                onClick={speakQuestion} 
                                className="text-orange-400 hover:scale-110 active:scale-95 transition-transform"
                            >
                                <VolumeIcon />
                            </button>
                        </div>
                        
                        <div className="flex items-center gap-3 justify-center text-gray-500 font-bold">
                            <span className="text-xs">{lang === 'zh' ? '塗色進度' : 'Progress'}</span>
                            <div className="w-44 h-3.5 bg-gray-200 rounded-full overflow-hidden border border-gray-300">
                                <div className="h-full bg-green-400 transition-all duration-300" style={{width: `${Math.min(100, (coverage/80)*100)}%`}}></div>
                            </div>
                            <span className={`text-xs ${coverage >= 80 ? 'text-green-500 font-black' : ''}`}>{Math.round(Math.min(100, (coverage/80)*100))}%</span>
                        </div>
                    </div>

                    {/* 畫布核心區 */}
                    <div className="relative w-full max-w-sm aspect-square bg-white rounded-[45px] shadow-2xl border-[10px] border-white overflow-hidden mb-6 p-8">
                        <div className="absolute inset-0 pointer-events-none opacity-[0.03]" style={{ backgroundImage: 'linear-gradient(#000 1.5px, transparent 1.5px), linear-gradient(90deg, #000 1.5px, transparent 1.5px)', backgroundSize: '25px 25px' }} />
                        
                        <div className="relative w-full h-full">
                            {/* 第一層：底色提示線 */}
                            <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full pointer-events-none">
                                <path d={currentLevel.path} fill="#FAFAFA" stroke="#EAEAEA" strokeWidth="1" />
                            </svg>
                            
                            {/* 第二層：畫布 */}
                            <canvas 
                                ref={canvasRef} 
                                width="200" 
                                height="200" 
                                onMouseDown={handleStart} 
                                onMouseMove={handleMove} 
                                onMouseUp={handleEnd} 
                                onMouseLeave={handleEnd}
                                onTouchStart={handleStart} 
                                onTouchMove={handleMove} 
                                onTouchEnd={handleEnd}
                                className="absolute inset-0 w-full h-full z-10 cursor-crosshair"
                            />
                            
                            {/* 第三層：最上層粗黑外框與葉子果梗線 */}
                            <svg viewBox="0 0 200 200" className="absolute inset-0 w-full h-full pointer-events-none z-20">
                                <path d={currentLevel.path} fill="none" stroke="#2D3436" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                                {renderLevelDetails(currentLevel.id)}
                            </svg>
                        </div>

                        {/* 過關視窗 */}
                        {isCompleted && (
                            <div className="absolute inset-0 z-30 bg-white/75 backdrop-blur-sm flex items-center justify-center animate-fade-in text-center p-4">
                                <div className="animate-pop-in bg-white p-7 rounded-[35px] shadow-2xl border-4 border-green-400 max-w-[280px] w-full">
                                    <div className="text-3xl mb-1 text-yellow-400 flex justify-center gap-1">
                                        <StarIcon fill="currentColor" />
                                        <div className="animate-bounce"><StarIcon fill="currentColor" /></div>
                                        <StarIcon fill="currentColor" />
                                    </div>
                                    <p className="text-2xl font-black text-green-600 mb-0.5">{lang === 'zh' ? '太厲害了！' : 'EXCELLENT!'}</p>
                                    <p className="text-xs text-gray-500 font-bold mb-5 leading-relaxed">
                                        {lang === 'zh' ? `答對了！這是${currentLevel.colorName.zh}的${currentLevel.objectName.zh}` : `Correct! This is a ${currentLevel.colorName.en} ${currentLevel.objectName.en}`}
                                    </p>
                                    <button 
                                        onClick={() => setLevelIdx((levelIdx + 1) % LEVELS.length)} 
                                        className="bg-green-500 text-white px-8 py-2.5 rounded-xl font-black shadow-lg hover:bg-green-600 active:scale-95 transition-all flex items-center justify-center gap-1 mx-auto w-full"
                                    >
                                        {lang === 'zh' ? '下一關' : 'Next'}
                                        <ChevronRightIcon />
                                    </button>
                                </div>
                                <Confetti />
                            </div>
                        )}
                    </div>

                    {/* 彩色調色盤 */}
                    <div className="grid grid-cols-3 sm:grid-cols-7 gap-4 bg-white/95 backdrop-blur-md p-5 rounded-[32px] shadow-xl border border-white max-w-lg w-full">
                        {COLORS.map(c => (
                            <button 
                                key={c.code} 
                                onClick={() => { 
                                    setSelectedColor(c); 
                                    speakBilingual(c.zh, c.en); 
                                }}
                                className={`flex flex-col items-center transition-all duration-300 ${selectedColor?.code === c.code ? 'scale-110 -translate-y-2' : 'opacity-65 hover:opacity-100'}`}
                            >
                                <div className={`w-9 h-14 rounded-t-lg rounded-b-xl border-4 ${selectedColor?.code === c.code ? 'border-orange-300' : 'border-white'} shadow-md`} style={{backgroundColor: c.code}}>
                                    <div className="w-full h-5 bg-black/5 mt-3" />
                                </div>
                                <span className="text-[10px] font-black mt-1.5 text-gray-500">{lang === 'zh' ? c.zh : c.en}</span>
                            </button>
                        ))}
                        
                        <button 
                            onClick={() => { 
                                const ctx = ctxRef.current;
                                ctx.clearRect(0, 0, 200, 200);
                                setCoverage(0);
                                setIsCompleted(false);
                                speakBilingual('重來一次', 'Try again');
                            }}
                            className="flex flex-col items-center justify-center text-gray-400 hover:text-red-500 active:scale-90 transition-all"
                        >
                            <div className="w-9 h-14 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center mb-1">
                                <RotateCcwIcon />
                            </div>
                            <span className="text-[9px] font-black">RESET</span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
